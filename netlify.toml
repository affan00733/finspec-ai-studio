# Netlify config: public demo runs entirely in the browser (no backend required).
# Paths are relative to the repository root (avoids base/publish path mismatches).
[build]
  command = "npm ci && npm run build"
  publish = "frontend/dist"
  base = "frontend"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: serve index.html for client-side routes.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
